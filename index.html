<!DOCTYPE html>
<html>
<head>
<title>IB Racing Pro</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
}

#road{
width:300px;
height:100vh;
background:gray;
margin:auto;
position:relative;
}

#car{
width:50px;
position:absolute;
bottom:20px;
left:125px;
}

.line{
width:10px;
height:80px;
background:white;
position:absolute;
left:145px;
animation:move 1s linear infinite;
}

@keyframes move{
0%{top:-100px;}
100%{top:100vh;}
}

</style>
</head>

<body>

<div id="road">

<img id="car" src="https://i.imgur.com/7QF5FQK.png">

<div class="line" style="top:0"></div>
<div class="line" style="top:200px"></div>
<div class="line" style="top:400px"></div>

</div>

<audio id="engine" loop>
<source src="https://www.soundjay.com/mechanical/sounds/car-engine-1.mp3">
</audio>

<script>

let car = document.getElementById("car");
let engine = document.getElementById("engine");

let x = 125;

document.addEventListener("keydown", control);

function control(e){

if(e.key=="ArrowLeft"){
x -= 10;
}

if(e.key=="ArrowRight"){
x += 10;
}

if(e.key=="ArrowUp"){
engine.play();
}

car.style.left = x + "px";

}

</script>

</body>
</html>
